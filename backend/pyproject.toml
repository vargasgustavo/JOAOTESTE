[project]
name = "mesas-filas-api"
version = "0.1.0"
description = "V0 SaaS de gestao de mesas e filas para restaurantes"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# extend-exclude preserva os excludes padrao (.venv, __pycache__, ...).
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"seed.py" = ["S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Garante que "pytest" (executavel) enxergue o pacote app, e nao so "python -m pytest".
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
