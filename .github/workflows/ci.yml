name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesas
          POSTGRES_PASSWORD: mesas
          POSTGRES_DB: mesas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesas" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mesas:mesas@localhost:5432/mesas_test
      DATABASE_URL: postgresql+psycopg://mesas:mesas@localhost:5432/mesas_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-a-real-secret
      JWT_SECRET_KEY: ci-jwt-secret-key-not-a-real-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations aplicam do zero
        run: alembic upgrade head
      - name: Testes (inclui concorrencia em PostgreSQL)
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mesas
          POSTGRES_PASSWORD: mesas
          POSTGRES_DB: mesas_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesas" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mesas:mesas@localhost:5432/mesas_e2e
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-a-real-secret
      JWT_SECRET_KEY: ci-jwt-secret-key-not-a-real-secret
      COOKIE_SECURE: "false"
      RATELIMIT_ENABLED: "false"
      API_INTERNAL_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python seed.py
          gunicorn --bind 127.0.0.1:8000 --workers 2 wsgi:app --daemon --log-file -
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 1;
          done

      - name: Preparar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Rodar E2E
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t mesas-api:ci ./backend
      - name: Build da imagem do frontend
        run: docker build -t mesas-web:ci ./frontend
